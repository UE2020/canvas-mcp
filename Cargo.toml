[package]
name = "canvas-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
directories = "6"
lopdf = { version = "0.38", default-features = false }
pdf-extract = "0.10"
quick-xml = "0.39"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.2", features = [ "server", "macros", "schemars", "transport-io"] }
thirtyfour = "0.37.5"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
